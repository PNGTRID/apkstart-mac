# 发布流水线：tag v* 触发，macOS 打包 DMG 上传 GitHub Release。
# 无 Apple Developer 账号：产物为 ad-hoc 签名（tauri 默认），README 有 Gatekeeper 放行引导。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ApkStart for Mac ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## 下载与安装

            下载下方 `.dmg`，拖入「应用程序」。首次打开遇 Gatekeeper 拦截（本应用暂无 Apple 公证），任选其一放行：

            1. **右键打开**：右键 `apkstart-mac.app` → 「打开」→ 再点「打开」（只需一次）
            2. **系统设置放行**：系统设置 → 隐私与安全性 → 「仍要打开」
            3. **命令行**：`xattr -d com.apple.quarantine /Applications/apkstart-mac.app`

            首次启动按主界面引导下载安卓运行时（约 1.2GB，一次即可）。

            ## 已知限制

            - 仅支持 Apple Silicon（M 系列）；x86-only 的安卓应用明确不支持
            - 需要 macOS 13.3+（投屏依赖 WebCodecs）
            - 高负载下模拟器偶发 gRPC 停机崩溃（详见 README 已知问题）
